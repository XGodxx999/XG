<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050608"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="XG Prime">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.png?v=6" type="image/png"><link rel="apple-touch-icon" sizes="180x180" href="./icon.png?v=6">
<title>XG Prime</title>
<link rel="stylesheet" href="./assets/css/app.css?v=3"><script>try{if(localStorage.getItem('xg-prime-theme')==='light'){document.documentElement.dataset.theme='light';var __m=document.querySelector('meta[name="theme-color"]');if(__m)__m.setAttribute('content','#dfe7f0');}}catch(e){}</script>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brandlock"><span class="brandmark xglogo" role="img" aria-label="XG"></span><div><div class="brandname">XG PRIME</div><div class="tagline">PLAN · LEARN · GROW</div></div></div><div style="display:flex;align-items:center;gap:9px"><select id="languageSelect" class="langselect" aria-label="Language"><option value="zh-CN">中文</option><option value="en">EN</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="es">ES</option><option value="fr">FR</option></select><button class="iconbtn" id="profileShortcut" aria-label="个人中心">⌘</button></div></header>

<main>
<section id="home" class="page active">
<div class="hero">
  <div class="eyebrow">XG PRIME</div>
  <h1>PLAN · LEARN · GROW</h1>
  <p>把目标拆成行动，把每一步变成进度。</p>
  <div class="date" id="date"></div>
</div>

<button class="profilepill" data-go="me">
  <span class="ppavatar xglogo" role="img" aria-label="XG"></span>
  <span class="pptext"><strong>XG Prime</strong><small>Aim Higher.</small></span>
  <span class="ppchev">›</span>
</button>

<div class="grid2">
  <button class="shortcut" data-go="money"><span class="glyph">↗</span><strong>财务管理</strong><small>记账与统计</small></button>
  <button class="shortcut" data-go="learn"><span class="glyph">▤</span><strong>学习成长</strong><small>英语与技能</small></button>
  <button class="shortcut" data-go="goals"><span class="glyph">◎</span><strong>每日目标</strong><small>今日进度</small></button>
  <button class="shortcut" data-go="tools"><span class="glyph">⌘</span><strong>实用工具</strong><small>计算与换算</small></button>
</div>

<div class="cathead"><strong>今日目标</strong></div>
<div class="card goalcard">
  <div class="goalleft">
    <span class="goalring"><span id="progressText">0%</span></span>
    <div class="muted" id="goalCount" style="font-size:12px;margin-top:4px">0 / 0 已完成</div>
  </div>
  <div id="goalPreview" class="goalright"></div>
  <div class="progressTrack"><div class="progressFill" id="progressFill"></div></div>
</div>

<div class="grid2" style="margin-top:12px">
  <div class="card"><div class="statlabel">总收入</div><div class="stat" id="income">¥0.00</div></div>
  <div class="card"><div class="statlabel">总支出</div><div class="stat" id="expense">¥0.00</div></div>
</div>

<div class="panel" style="margin-top:16px">
  <div class="cathead"><strong>快捷入口</strong></div>
  <div class="quickrow">
    <button class="quickbtn" data-tool="calculator"><b>▦</b>计算器</button>
    <button class="quickbtn" data-tool="translate"><b>文</b>翻译</button>
    <button class="quickbtn" data-go="workspace"><b>📋</b>工作台</button>
    <button class="quickbtn" data-go="tools"><b>···</b>更多</button>
  </div>
</div>
</section>
