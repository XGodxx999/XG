<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="XG Prime"><link rel="manifest" href="./manifest.webmanifest"><title>XG Prime</title><style>
:root{color-scheme:dark;--bg:#08090b;--panel:#15191f;--line:#303741;--muted:#929ba6;--text:#f3f5f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#252c35,#08090b 70%);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 16px 90px}.app{max-width:650px;margin:auto}header,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}header{padding:22px 2px}.brand{font-weight:850;letter-spacing:3px}.muted,small{color:var(--muted)}.hero,.panel,.tile{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#1b2027,#101317);padding:17px;margin-bottom:12px}.hero{padding:24px}.hero h1{font-size:27px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{text-align:left;color:inherit;min-height:85px}.tile b{display:block;margin-bottom:6px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0c0e12ed;border-top:1px solid var(--line);display:flex;justify-content:center;padding:10px env(safe-area-inset-right) calc(10px + env(safe-area-inset-bottom))}.tabs div{width:min(650px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tabs button,button{border:1px solid var(--line);border-radius:12px;background:#20262e;color:var(--text);padding:11px}.tabs button.active{background:#dce3eb;color:#08090b}.page{display:none}.page.active{display:block}input,select{background:#090c10;color:white;border:1px solid var(--line);padding:12px;border-radius:10px;min-width:0;width:100%}.form{display:flex;gap:8px;margin:12px 0}.form button{white-space:nowrap}.item{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}.item span{flex:1}.done{text-decoration:line-through;color:var(--muted)}.stat{font-size:25px;font-weight:700;margin-top:7px}.word{font-size:32px;font-weight:800;margin:18px 0}.note{font-size:12px;color:var(--muted);line-height:1.6}
</style></head><body><div class="app"><header><div><div class="brand">XG PRIME</div><small>PLAN · LEARN · GROW</small></div><button id="reset">重置</button></header>
<section id="home" class="page active"><div class="hero"><small>YOUR PERSONAL COMMAND CENTER</small><h1>Build your next level.</h1><div>把目标拆成今天能完成的行动。</div><p id="date" class="muted"></p></div><div class="grid"><div class="panel"><small>收入记录</small><div class="stat" id="income">¥0</div></div><div class="panel"><small>支出记录</small><div class="stat" id="expense">¥0</div></div></div><div class="panel"><div class="row"><b>今日目标完成</b><span id="progress">0%</span></div><div id="count" class="muted">0 / 0</div></div><div class="grid"><button class="tile" data-open="goals"><b>每日目标</b><small>建立习惯，追踪进度</small></button><button class="tile" data-open="learn"><b>英语学习</b><small>基础词汇练习</small></button><button class="tile" data-open="money"><b>财务管理</b><small>收入与支出</small></button><button class="tile" data-open="career"><b>职业规划</b><small>HVAC 技能路线</small></button></div></section>
<section id="goals" class="page"><h2>每日目标</h2><div class="panel"><div class="form"><input id="goalInput" placeholder="输入今天要完成的事"><button id="addGoal">添加</button></div><div id="goalList"></div></div></section>
<section id="learn" class="page"><h2>英语学习</h2><div class="panel"><small id="wordNum">WORD 1 / 10</small><div class="word" id="word">work</div><div id="meaning" class="muted">点击显示释义</div><div class="form"><button id="reveal">显示释义</button><button id="next">下一个</button></div></div></section>
<section id="money" class="page"><h2>财务管理</h2><div class="panel"><div class="form"><select id="type"><option value="income">收入</option><option value="expense">支出</option></select><input id="amount" type="number" placeholder="金额"><input id="memo" placeholder="备注"></div><button id="addTx">保存记录</button><div id="txList"></div></div></section>
<section id="career" class="page"><h2>HVAC 职业学习</h2><div class="panel" id="careerList"></div><p class="note">学习清单仅用于个人进度追踪。实际培训、证书和海外职业评估要求以当地官方规定为准。</p></section>
</div><nav class="tabs"><div><button class="active" data-tab="home">首页</button><button data-tab="goals">目标</button><button data-tab="learn">英语</button><button data-tab="money">财务</button></div></nav>
<script>
const $=id=>document.getElementById(id),key='xg-prime-data';let data={goals:[],tx:[],career:[]};try{data={...data,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{};const save=()=>{localStorage.setItem(key,JSON.stringify(data));render()};const money=n=>'¥'+Number(n||0).toFixed(2);
function render(){ $('goalList').innerHTML=data.goals.map((g,i)=>'<div class="item"><input type="checkbox" data-goal="'+i+'" '+(g.done?'checked':'')+'><span class="'+(g.done?'done':'')+'">'+safe(g.text)+'</span><button data-del="'+i+'">删除</button></div>').join('')||'<p class="muted">还没有目标</p>';let inc=0,exp=0;data.tx.forEach(t=>{if(t.type==='income')inc+=t.amount;else exp+=t.amount});$('income').textContent=money(inc);$('expense').textContent=money(exp);let done=data.goals.filter(g=>g.done).length;$('count').textContent=done+' / '+data.goals.length;$('progress').textContent=(data.goals.length?Math.round(done/data.goals.length*100):0)+'%';$('txList').innerHTML=data.tx.map((t,i)=>'<div class="item"><span>'+safe(t.memo||'记录')+' · '+t.date+'</span><b>'+ (t.type==='income'?'+':'−')+money(t.amount)+'</b><button data-txdel="'+i+'">删除</button></div>').join('');$('careerList').innerHTML=['了解制冷循环与基础原理','学习常见 HVAC 工具与安全规范','学习铜管加工、焊接与保温','学习电气基础与控制线路','练习设备安装、维护与故障排查','整理培训证明与工作经历'].map((x,i)=>'<div class="item"><input type="checkbox" data-career="'+i+'" '+(data.career[i]?'checked':'')+'><span>'+x+'</span></div>').join('')}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(b.dataset.open));
$('date').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
$('addGoal').onclick=()=>{let v=$('goalInput').value.trim();if(v){data.goals.push({text:v,done:false});$('goalInput').value='';save()}};
$('goalList').onchange=e=>{if(e.target.dataset.goal!==undefined){data.goals[+e.target.dataset.goal].done=e.target.checked;save()}};
$('goalList').onclick=e=>{if(e.target.dataset.del!==undefined){data.goals.splice(+e.target.dataset.del,1);save()}};
$('addTx').onclick=()=>{let n=Number($('amount').value);if(n>0){data.tx.push({type:$('type').value,amount:n,memo:$('memo').value,date:new Date().toLocaleDateString('zh-CN')});$('amount').value='';$('memo').value='';save()}};
$('txList').onclick=e=>{if(e.target.dataset.txdel!==undefined){data.tx.splice(+e.target.dataset.txdel,1);save()}};
$('careerList').onchange=e=>{if(e.target.dataset.career!==undefined){data.career[+e.target.dataset.career]=e.target.checked;save()}};
const words=[['work','工作'],['learn','学习'],['save','储蓄；节省'],['skill','技能'],['job','工作；职位'],['time','时间'],['today','今天'],['future','未来'],['money','钱'],['goal','目标']];let wi=0;$('word').textContent=words[0][0];$('wordNum').textContent='WORD 1 / 10';$('reveal').onclick=()=>$('meaning').textContent=words[wi][1];$('next').onclick=()=>{wi=(wi+1)%words.length;$('word').textContent=words[wi][0];$('wordNum').textContent='WORD '+(wi+1)+' / 10';$('meaning').textContent='点击显示释义'};
$('reset').onclick=()=>{if(confirm('清空本机所有 XG Prime 数据？')){data={goals:[],tx:[],career:[]};save()}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
