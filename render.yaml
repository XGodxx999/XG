services:
  - type: web
    name: xg-prime-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGIN
        value: https://xgodxx999.github.io
      - key: AI_PROVIDER
        value: huggingface
      - key: AI_BASE_URL
        value: https://router.huggingface.co/v1/chat/completions
      - key: AI_MODEL
        value: swiss-ai/Apertus-70B-Instruct-2509:publicai
      - key: AI_DAILY_LIMIT
        value: 20
      - key: AI_API_KEY
        sync: false
