services:
  - type: web
    name: xg-prime-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGIN
        value: https://xgodxx999.github.io
      - key: AI_PROVIDER
        value: gemini
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_DAILY_LIMIT
        value: 20
      - key: AI_API_KEY
        sync: false
