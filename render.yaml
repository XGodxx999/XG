services:
  - type: web
    name: xg-prime-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGIN
        value: https://xgodxx999.github.io
      - key: AI_PROVIDER
        value: openrouter
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: AI_MODEL
        value: openrouter/free
      - key: AI_API_KEY
        sync: false
