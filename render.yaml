services:
  - type: web
    name: xg-prime-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGIN
        value: https://xgodxx999.github.io
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
